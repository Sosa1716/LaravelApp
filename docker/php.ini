; Ajustes de PHP para producción (se cargan después de php.ini-production)
expose_php = Off
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código es inmutable dentro de la imagen: no revisar timestamps.
opcache.validate_timestamps = 0
