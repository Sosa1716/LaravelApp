# =============================================================================
#  Pipeline único de CI/CD — El Pinguin API (Laravel 12)
#
#  Flujo de ramas:  feature/* ──PR──▶ develop ──PR──▶ staging ──PR──▶ main
#
#  ┌────────┐   ┌──────────────────────┐   ┌────────┐
#  │  lint  │   │ tests (matriz 3×2×2) │   │ package│
#  └───┬────┘   └──────────┬───────────┘   └───┬────┘
#      └──────────┬────────┘                   │
#              ci-ok ──────────────────────────┘
# =============================================================================
name: CI/CD

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch:

# Un solo pipeline activo por rama/PR. En PRs se cancela el anterior; en pushes
# a ramas de despliegue NO, para no cortar un deploy a la mitad.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_EXTENSIONS: mbstring, pdo, pdo_sqlite, sqlite3, pdo_pgsql, pgsql, zip, intl, fileinfo, bcmath

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Calidad de código y seguridad de dependencias
  # ---------------------------------------------------------------------------
  lint:
    name: Lint y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Validar composer.json / composer.lock
        run: composer validate --strict

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.2-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-8.2-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Estilo de código (Laravel Pint)
        run: vendor/bin/pint --test

      - name: Auditoría de seguridad (composer audit)
        run: composer audit --no-interaction

  # ---------------------------------------------------------------------------
  # Pruebas: matriz multiplataforma  SO × PHP × motor de BD  (12 combinaciones)
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (${{ matrix.os }}, PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: ['8.2', '8.3']
        db: [sqlite, pgsql]
        include:
          # La cobertura se mide en una sola combinación (la más rápida).
          - os: ubuntu-latest
            php: '8.3'
            db: sqlite
            coverage: true
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Ruta de caché de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Preparar entorno (.env + APP_KEY)
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # PostgreSQL en los 3 sistemas operativos (los service containers de
      # GitHub solo funcionan en Linux, por eso se usa esta acción).
      - name: Levantar PostgreSQL
        if: matrix.db == 'pgsql'
        uses: ikalnytskyi/action-setup-postgres@v6
        with:
          username: laravel
          password: secret
          database: testing
          port: 5432

      - name: Configurar conexión PostgreSQL
        if: matrix.db == 'pgsql'
        run: |
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=testing"
            echo "DB_USERNAME=laravel"
            echo "DB_PASSWORD=secret"
          } >> "$GITHUB_ENV"

      - name: Ejecutar pruebas
        run: |
          mkdir -p reports
          if [ "${{ matrix.coverage }}" = "true" ]; then
            php vendor/bin/phpunit --log-junit reports/junit.xml \
              --coverage-text --coverage-clover reports/clover.xml --coverage-html reports/coverage-html
          else
            php vendor/bin/phpunit --log-junit reports/junit.xml
          fi

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.db }}
          path: reports/junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Subir reporte de cobertura
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/clover.xml
            reports/coverage-html
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Puerta única de CI: es el check que exige la protección de ramas.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de lint y tests
        run: |
          echo "lint=${{ needs.lint.result }}  tests=${{ needs.tests.result }}"
          [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.tests.result }}" = "success" ]

  # ---------------------------------------------------------------------------
  # Paquete de la aplicación (código + vendor de producción) como artefacto.
  # ---------------------------------------------------------------------------
  package:
    name: Empaquetar aplicación
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Instalar dependencias de producción
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Crear tarball
        run: |
          mkdir -p dist
          tar --exclude=.git --exclude=.github --exclude=tests --exclude=node_modules \
              --exclude=dist --exclude=.env --exclude='storage/logs/*' \
              -czf "dist/el-pinguin-api-${GITHUB_SHA::7}.tar.gz" .
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS.txt

      - name: Subir artefacto de la aplicación
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Imagen Docker: build → smoke test del contenedor → push a GHCR
  # (en PRs solo se construye y prueba; se publica únicamente en pushes)
  # ---------------------------------------------------------------------------
  docker:
    name: Imagen Docker (build, smoke test, GHCR)
    needs: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Metadatos y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (carga local para smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: el-pinguin:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          set -euo pipefail
          mkdir -p reports
          APP_KEY="base64:$(openssl rand -base64 32)"
          # PORT=10000 simula a Render, que inyecta el puerto en tiempo de ejecución.
          docker run -d --name smoke -p 10000:10000 \
            -e PORT=10000 -e APP_KEY="$APP_KEY" \
            -e DB_CONNECTION=sqlite -e SEED_ON_DEPLOY=true \
            -e SESSION_DRIVER=cookie -e CACHE_STORE=file \
            el-pinguin:ci

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:10000/up > /dev/null && break
            sleep 2
          done

          {
            echo "== Smoke test de la imagen ${GITHUB_SHA}"
            echo "GET /up          -> $(curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/up)"
            echo "GET /api/version -> $(curl -s http://localhost:10000/api/version)"
          } | tee reports/smoke-container.txt

          curl -fsS http://localhost:10000/up > /dev/null
          curl -fsS http://localhost:10000/api/version | grep -q "\"version\":\"${GITHUB_SHA}\""

          login=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:10000/api/login \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"email":"admin@restaurante.com","password":"12345678"}')
          echo "POST /api/login  -> $login" | tee -a reports/smoke-container.txt
          [ "$login" = "200" ]

          [ "$(docker inspect --format '{{.Config.User}}' el-pinguin:ci)" = "app" ] \
            && echo "Usuario del contenedor: app (no root)" | tee -a reports/smoke-container.txt

      - name: Logs del contenedor (si falló)
        if: failure()
        run: docker logs smoke || true

      - name: Login en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push a GHCR
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true

      - name: Información del build
        if: always()
        run: |
          mkdir -p reports
          cat > reports/build-info.json <<EOF
          {
            "image": "${{ steps.img.outputs.name }}",
            "digest": "${{ steps.push.outputs.digest }}",
            "pushed": ${{ github.event_name == 'push' }},
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          printf '%s\n' "${{ steps.meta.outputs.tags }}" > reports/image-tags.txt
          cat reports/build-info.json

      - name: Subir artefacto del build Docker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build
          path: |
            reports/build-info.json
            reports/image-tags.txt
            reports/smoke-container.txt
          retention-days: 30
